# Serves the built app and, like the Vite dev server, forwards /api and
# /uploads to the API, so the browser sees one origin. "api" is the service
# name in the backend's docker-compose.yml.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS. With the address in a variable nginx looks "api" up again
  # (every 10 s) instead of once at start, so a rebuilt api container that got
  # a new IP keeps working without restarting this one.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:3000;

  # Facility images are up to 5 MB.
  client_max_body_size 6m;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass $api;
    proxy_set_header Host $host;
  }

  # Client-side routes such as /admin/facilitati load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
